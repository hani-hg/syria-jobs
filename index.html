<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>وظائف سوريا | كل الشواغر بمكان واحد</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
  <div>
    <h1>وظائف سوريا</h1>
    <div class="sub">كل الشواغر الحكومية والخاصة بمكان واحد</div>
  </div>
  <div class="updated" id="lastUpdated"></div>
</header>

<main>
  <div class="search-box">
    <input type="text" id="searchInput" placeholder="ابحث عن مسمى وظيفي...">
    <div class="filters-row">
      <select id="locationFilter"><option value="">كل المحافظات</option></select>
      <select id="categoryFilter"><option value="">كل المجالات</option></select>
      <select id="typeFilter">
        <option value="">حكومي وخاص</option>
        <option value="حكومي">حكومي فقط</option>
        <option value="خاص">خاص فقط</option>
      </select>
    </div>
  </div>

  <div class="count" id="resultCount"></div>
  <div class="cards" id="cardsContainer"></div>
  <div class="empty" id="emptyState" style="display:none;">لا توجد نتائج مطابقة حالياً</div>
</main>

<button class="cta" onclick="openModal()">+ انشر طلب توظيف</button>

<div class="modal-bg" id="modalBg">
  <div class="modal">
    <h2>نشر طلب توظيف (قطاع خاص)</h2>
    <input type="text" id="mTitle" placeholder="المسمى الوظيفي">
    <input type="text" id="mLocation" placeholder="المحافظة">
    <textarea id="mBody" placeholder="تفاصيل الوظيفة والشروط..."></textarea>
    <input type="text" id="mContact" placeholder="رقم للتواصل">
    <div class="modal-actions">
      <button class="btn-ghost" onclick="closeModal()">إلغاء</button>
      <button class="btn-primary" onclick="submitAd()">نشر</button>
    </div>
  </div>
</div>

<footer>
  هذا الموقع مجمّع لإعلانات التوظيف المنشورة من جهات رسمية وخاصة، وليس جهة توظيف. يرجى التحقق من كل فرصة بنفسك.
</footer>

<script src="js/app.js"></script>
</body>
</html>
