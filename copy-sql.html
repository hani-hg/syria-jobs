<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>نسخ أمر SQL</title>
  <style>
    body { font-family: Tahoma, sans-serif; margin: 0; padding: 24px; background: #111; color: #fff; }
    h1 { font-size: 22px; }
    p { color: #ddd; line-height: 1.8; }
    textarea { width: 100%; min-height: 180px; padding: 14px; border-radius: 12px; border: 0; font-size: 16px; direction: ltr; text-align: left; }
    button { width: 100%; margin-top: 14px; padding: 16px; border: 0; border-radius: 12px; background: #0F6E52; color: #fff; font-size: 20px; font-weight: bold; }
    #msg { margin-top: 12px; min-height: 24px; color: #2EBE8A; font-weight: bold; text-align: center; }
  </style>
</head>
<body>
  <h1>انسخ أمر SQL</h1>
  <p>اضغط الزر الأخضر لنسخ النص، ثم الصقه في Supabase → SQL Editor → Run.</p>
  <textarea id="sql" readonly>alter table public.job_submissions disable row level security;
grant usage on schema public to anon, authenticated;
grant select, insert, update, delete on table public.job_submissions to anon, authenticated;</textarea>
  <button type="button" onclick="copySql()">نسخ النص</button>
  <div id="msg"></div>
  <script>
    async function copySql() {
      const text = document.getElementById('sql').value;
      try {
        await navigator.clipboard.writeText(text);
        document.getElementById('msg').textContent = 'تم النسخ. الصقه الآن في Supabase.';
      } catch {
        document.getElementById('sql').focus();
        document.getElementById('sql').select();
        document.execCommand('copy');
        document.getElementById('msg').textContent = 'إذا لم يُنسخ، اضغط مطولاً على النص واختر نسخ.';
      }
    }
  </script>
</body>
</html>
