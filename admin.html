<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#123d2b">
  <title>لوحة التحكم | وظائف سوريا</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/admin.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="admin-body">
  <header class="site-header"><div class="container header-inner"><a class="brand" href="index.html"><span class="brand-mark">س</span><span><strong>وظائف سوريا</strong><small>لوحة التحكم</small></span></a><button class="btn btn-outline admin-signout" id="signOutBtn" type="button" hidden>تسجيل الخروج</button></div></header>
  <main class="container admin-main">
    <section class="admin-login" id="loginPanel"><p class="eyebrow">منطقة الإدارة</p><h1>تسجيل الدخول</h1><p>هذه الصفحة مخصصة للمستخدمين المضافين إلى قائمة المدراء.</p><form id="loginForm"><label>البريد الإلكتروني<input id="email" type="email" autocomplete="username" required placeholder="admin@example.com"></label><label>كلمة المرور<input id="password" type="password" autocomplete="current-password" required></label><button class="btn btn-gold" type="submit">دخول</button><p id="loginMessage" class="admin-message"></p></form></section>
    <section id="dashboardPanel" hidden><div class="admin-heading"><div><p class="eyebrow">إدارة المحتوى</p><h1>طلبات التوظيف</h1><p id="adminEmail"></p></div><button class="btn btn-outline admin-signout" id="signOutBtnAlt" type="button">تسجيل الخروج</button></div>
      <div class="admin-stats"><div><strong id="pendingCount">0</strong><span>قيد المراجعة</span></div><div><strong id="approvedCount">0</strong><span>معتمدة</span></div><div><strong id="rejectedCount">0</strong><span>مرفوضة</span></div></div>
      <div class="admin-toolbar"><div class="admin-tabs" role="tablist"><button class="active" data-status="pending" type="button">قيد المراجعة</button><button data-status="approved" type="button">معتمدة</button><button data-status="rejected" type="button">مرفوضة</button><button data-status="all" type="button">الكل</button></div><button class="btn btn-primary" id="refreshBtn" type="button">تحديث</button></div>
      <div id="adminMessage" class="admin-message"></div><div id="submissionsList" class="submissions-list"></div>
    </section>
  </main>
  <div id="toast" class="toast" role="status"></div>
  <script src="js/admin.js"></script>
</body>
</html>
